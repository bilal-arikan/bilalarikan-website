<!DOCTYPE html>
<html lang="tr">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex, follow">
	<title>Sayfa bulunamadı &#8211; Bilal ARIKAN</title>

	<link rel="icon" href="/wp-content/uploads/2020/05/cropped-BA-tamam-4-1-32x32.png" sizes="32x32">
	<link rel="icon" href="/wp-content/uploads/2020/05/cropped-BA-tamam-4-1-192x192.png" sizes="192x192">
	<link rel="apple-touch-icon" href="/wp-content/uploads/2020/05/cropped-BA-tamam-4-1-180x180.png">

	<!-- Deliberately self-contained: GitHub Pages serves this file for any depth,
	     so relative asset paths would break outside the site root. -->
	<style>
		:root {
			color-scheme: light dark;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
			font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			background: #1c1c1c;
			color: #e8e8e8;
			text-align: center;
		}

		main {
			max-width: 560px;
		}

		.code {
			margin: 0;
			font-size: clamp(72px, 18vw, 140px);
			font-weight: 700;
			line-height: 1;
			letter-spacing: -0.04em;
			color: #ff5722;
		}

		h1 {
			margin: 8px 0 16px;
			font-size: clamp(20px, 4vw, 28px);
			font-weight: 600;
		}

		p {
			margin: 0 0 32px;
			font-size: 16px;
			line-height: 1.6;
			color: #a9a9a9;
		}

		.links {
			display: flex;
			flex-wrap: wrap;
			gap: 12px;
			justify-content: center;
		}

		a {
			display: inline-block;
			padding: 12px 22px;
			border: 1px solid #3a3a3a;
			border-radius: 4px;
			color: #e8e8e8;
			text-decoration: none;
			font-size: 15px;
			transition: border-color 0.2s, color 0.2s;
		}

		a:hover,
		a:focus {
			border-color: #ff5722;
			color: #ff5722;
		}

		a.primary {
			background: #ff5722;
			border-color: #ff5722;
			color: #fff;
		}

		a.primary:hover,
		a.primary:focus {
			background: #e64a19;
			border-color: #e64a19;
			color: #fff;
		}
	</style>
</head>

<body>
	<main>
		<p class="code">404</p>
		<h1>Aradığın sayfa burada değil</h1>
		<p>Bağlantı taşınmış, yeniden adlandırılmış ya da hiç var olmamış olabilir.</p>
		<div class="links">
			<a class="primary" href="/">Ana sayfa</a>
			<a href="/portfolio/">Portfolyo</a>
			<a href="/contact-2/">İletişim</a>
		</div>
	</main>
</body>

</html>
